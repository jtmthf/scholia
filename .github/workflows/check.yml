name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Postgres isn't available on Windows GitHub runners as a service
      # container, so the hosted-path suite (@scholia/db, @scholia/server)
      # runs in the test-hosted job below on Linux. Both legs run everything
      # else here — Windows stays useful because path handling is what
      # diverges across platforms.
      - run: pnpm exec turbo run test --filter='!@scholia/db' --filter='!@scholia/server'

  # The hosted path (server/db integration tests) used to be excluded from CI
  # entirely, which let hosted-path regressions hide behind silent
  # `describe.skipIf(!DATABASE_URL)` skips. This job runs the full suite against
  # a real Postgres and refuses to pass if anything skipped for want of a
  # database. The check itself is `scripts/check-no-skipped-tests.mjs`.
  test-hosted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scholia
          POSTGRES_PASSWORD: scholia
          POSTGRES_DB: scholia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 127.0.0.1, not localhost — sidesteps IPv6 ::1 resolution failures.
      DATABASE_URL: postgres://scholia:scholia@127.0.0.1:5432/scholia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scholia/db migrate
      # Default reporter for humans; JSON reporter writes the file the
      # no-skipped check reads. No `--` here: pnpm already forwards trailing
      # args to the `vitest run` script — an extra `--` makes vitest treat
      # these flags as positional test-file filters instead, so no JSON file
      # is ever written and the next step fails on a missing results.json.
      # test:projects (not `test`, which is turbo-orchestrated per package)
      # runs every package's suite in one process, which is what a single
      # combined JSON report needs.
      - run: pnpm test:projects --reporter=default --reporter=json --outputFile=results.json
      - name: Fail if any test was skipped
        if: always()
        run: node ./scripts/check-no-skipped-tests.mjs results.json

  # Playwright e2e suite (e2e/) — the select-to-comment flow the unit/integration
  # tests can't cover. Ubuntu-only: it needs the docker-compose stack (Postgres +
  # MinIO) and a headless browser, which a Windows runner would only slow down.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Seconds on the trap from AGENTS.md: host port 5544 (not 5432), 127.0.0.1
      # (not localhost, to sidestep IPv6 ::1).
      DATABASE_URL: postgres://scholia:scholia@127.0.0.1:5544/scholia
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: scholia-blobs
      S3_ACCESS_KEY_ID: scholia
      S3_SECRET_ACCESS_KEY: scholia-secret
      S3_FORCE_PATH_STYLE: "true"
      # Registers the `scholia share` command the e2e seed drives.
      SCHOLIA_HOSTED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Bring up the stack the suite talks to: Postgres (state) + MinIO (blobs).
      # `--wait` blocks until the healthchecks pass; minio-init then creates the
      # blob bucket as a one-shot and exits.
      - run: docker compose up -d --wait postgres minio
      - run: docker compose run --rm minio-init
      - run: pnpm --filter @scholia/db migrate

      # Browsers + their OS libs, then the suite. Playwright's webServer boots the
      # API + viewer and reuses them.
      - run: pnpm --filter @scholia/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @scholia/e2e e2e

      # HTML report + per-test traces (trace: on-first-retry) for diagnosing
      # failures without re-running the suite.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Enforces that PRs with user-facing CLI changes carry a changeset. Private
  # `@scholia/*` packages are opted out of versioning in `.changeset/config.json`,
  # so a PR touching only internal packages passes without one. Skipped on the
  # bot's own version PR (`changeset-release/main`): it consumes pending
  # changesets and bumps package.json without adding a new one by design, so
  # this gate would otherwise always fail it.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/main` needs the full history to
          # compute the diff against the PR base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
